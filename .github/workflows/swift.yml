# Builds the SickleShield iOS app. This is an Xcode project generated by
# XcodeGen from ios/project.yml (not a Swift Package), so it's built with
# xcodebuild rather than `swift build`.

name: iOS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: ios

    steps:
    - uses: actions/checkout@v4

    - name: Accept Xcode license and run first-launch setup
      run: |
        sudo xcodebuild -license accept
        sudo xcodebuild -runFirstLaunch

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Build (generic iOS Simulator, unsigned)
      run: |
        xcodebuild build \
          -project SickleShield.xcodeproj \
          -scheme SickleShield \
          -destination 'generic/platform=iOS Simulator' \
          CODE_SIGNING_ALLOWED=NO
