# Fast validation of the SickleShield Xcode project (generated by XcodeGen
# from ios/project.yml). Deliberately does NOT run a full `xcodebuild build` -
# that step's cold-compile time on GitHub-hosted runners (20+ minutes with no
# caching) made this workflow too slow to be useful during active
# development. This still catches the class of bugs actually hit so far
# (project.yml / plist / entitlements misconfiguration) in well under a
# minute, at the cost of not catching real Swift compile errors. Worth
# reinstating a real build step later, once the project has stabilized and
# iteration has slowed down.
#
# XcodeGen is installed via a direct download of its release zip rather than
# `brew install` - Homebrew runs a full auto-update (fetching all of
# homebrew-core's metadata) before installing anything unless told not to,
# which was the actual cause of this workflow timing out even after the
# xcodebuild build step was removed.

name: iOS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 8

    defaults:
      run:
        working-directory: ios

    steps:
    - uses: actions/checkout@v4

    - name: Accept Xcode license and run first-launch setup
      run: |
        sudo xcodebuild -license accept
        sudo xcodebuild -runFirstLaunch

    - name: Install XcodeGen (direct download, not Homebrew)
      run: |
        curl -L -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
        unzip -q /tmp/xcodegen.zip -d "$HOME/xcodegen-tool"
        chmod +x "$HOME/xcodegen-tool/xcodegen/bin/xcodegen"
        echo "$HOME/xcodegen-tool/xcodegen/bin" >> "$GITHUB_PATH"

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Validate project structure (no compile)
      run: |
        xcodebuild -list -project SickleShield.xcodeproj
        xcodebuild -showBuildSettings \
          -project SickleShield.xcodeproj \
          -scheme SickleShield \
          > /dev/null
