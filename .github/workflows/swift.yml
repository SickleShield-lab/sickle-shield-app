# DISABLED (manual-trigger only) as of 2026-09-16.
#
# Across several attempts this workflow kept timing out inside `xcodegen
# generate` itself on GitHub's runners - first traced to an unaccepted Xcode
# license/first-launch setup, then (after fixing that) to Homebrew's implicit
# auto-update, and after fixing THAT, it hung in the exact same command again
# for a reason that needs the actual log output to diagnose (blocked here by
# "Sign in to view logs" - GitHub restricts raw logs to authenticated users
# even on public repos). Rather than keep guessing blind and burning CI time,
# this is switched to workflow_dispatch (Actions tab > this workflow > "Run
# workflow") so it can be run deliberately, with someone who can see the logs
# watching, instead of firing automatically on every push.
#
# To properly re-enable: change `on:` back to push/pull_request once the
# actual "Generate Xcode project" hang has been diagnosed from a real log.

name: iOS Build

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 8

    defaults:
      run:
        working-directory: ios

    steps:
    - uses: actions/checkout@v4

    - name: Accept Xcode license and run first-launch setup
      run: |
        sudo xcodebuild -license accept
        sudo xcodebuild -runFirstLaunch

    - name: Install XcodeGen (direct download, not Homebrew)
      run: |
        curl -L -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
        unzip -q /tmp/xcodegen.zip -d "$HOME/xcodegen-tool"
        chmod +x "$HOME/xcodegen-tool/xcodegen/bin/xcodegen"
        echo "$HOME/xcodegen-tool/xcodegen/bin" >> "$GITHUB_PATH"

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Validate project structure (no compile)
      run: |
        xcodebuild -list -project SickleShield.xcodeproj
        xcodebuild -showBuildSettings \
          -project SickleShield.xcodeproj \
          -scheme SickleShield \
          > /dev/null
