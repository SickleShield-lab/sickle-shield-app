name: SickleShield
options:
  bundleIdPrefix: com.sickleshield
targets:
  SickleShield:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SickleShield
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sickleshield.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Sickle Shield"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Sickle Shield uses your location to share it with your emergency contacts when you trigger SOS."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Sickle Shield needs access to your photos so you can upload medical reports."
        ENABLE_PREVIEWS: YES
