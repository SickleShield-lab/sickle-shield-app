name: SickleShield
options:
  bundleIdPrefix: com.sickleshield
targets:
  SickleShield:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SickleShield
      - path: Shared
        group: Shared
    dependencies:
      - target: SickleShieldWidgets
        embed: true
    entitlements:
      path: SickleShield/SickleShield.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sickleshield.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Sickle Shield"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Sickle Shield uses your location to share it with your emergency contacts when you trigger SOS, and to check local weather as part of your crisis risk score."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Sickle Shield needs access to your photos so you can upload medical reports."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Sickle Shield uses the microphone to let you log a crisis by voice."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Sickle Shield uses speech recognition to transcribe your voice when logging a crisis."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Sickle Shield reads your heart rate and blood oxygen to factor them into your crisis risk score."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ENABLE_PREVIEWS: YES

  SickleShieldWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SickleShieldWidgets
      - path: Shared
        group: Shared
    entitlements:
      path: SickleShieldWidgets/SickleShieldWidgets.entitlements
    info:
      path: SickleShieldWidgets/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sickleshield.app.widgets
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES

# Without this, XcodeGen auto-generates a separate runnable-looking scheme
# for every target, including the widget extension - which can't be
# launched standalone the normal way and greys out Run if it's the one
# selected in the scheme picker. Defining schemes explicitly here means
# there's exactly one scheme ("SickleShield") to pick, and it builds both
# targets together (the extension embeds into the app automatically).
schemes:
  SickleShield:
    build:
      targets:
        SickleShield: all
        SickleShieldWidgets: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
